name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Ephemeral database for migrations and integration tests; never a real one.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Placeholders only: this workflow has no secrets and never reaches GitHub or a real database.
    env:
      DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow
      BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
      AUTH_GITHUB_ID: ci-placeholder
      AUTH_GITHUB_SECRET: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # A report, not a gate: a new advisory should not block unrelated work. Read it in the log.
      - name: Audit dependencies (report only)
        run: npm audit
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Source guards (test helpers, raw colours)
        run: bash scripts/guards.sh
      - name: Apply migrations
        run: npm run db:migrate
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Real browser against the production build; it uses the same service database.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
